
[project]
name = "mxdc"
dynamic = ["version"]
description = "Mx Data Collector"
readme = "README.rst"
readme-content-type = "text/x-rst"
keywords = ["beamline", "data-acquisition", "crystallography", "MX"]
license = { file = "LICENSE" }
authors = [
    {name = "Michel Fodje",email = "michel.fodje@lightsource.ca"}
]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
requires-python = ">=3.9,<4.0"
dependencies = [
  "lz4",
  "pyzmq",
  "cryptography",
  "gepics",
  "pyepics",
  "h5py",
  "hdf5plugin",
  "matplotlib",
  "msgpack",
  "opencv-python",
  "pillow",
  "PyGObject",
  "pyyaml",
  "redis",
  "requests",
  "scipy",
  "twisted",
  "zeroconf",
  "python-magic",
  "pytz",
  "ipython",
  "mxio",
  "humanize",
  "lorem",
  "pandas",
  "backports-datetime-fromisoformat",
  "szrpc",
  "wget",
  "pytest",
  "methodtools",
  "webp",
  "numpy",
]


[project.urls]
Homepage = "https://github.com/michel4j/mxdc"
Issues = "https://github.com/michel4j/mxdc/issues"

[project.scripts]
archiver = "mxdc.utils.scripts:archiver"
blconsole = "mxdc.utils.scripts:console"
hutchviewer = "mxdc.utils.scripts:hutch_viewer"
imgview = "mxdc.utils.scripts:image_viewer"
mxdc = "mxdc.utils.scripts:main_mxdc"
plotxdi = "mxdc.utils.scripts:plot_xdi"
sim-console = "mxdc.utils.scripts:sim_console"
sim-mxdc = "mxdc.utils.scripts:sim_mxdc"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["mxdc"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440" # Options: "pep440", "semver", "pvp"
fallback-version = "0.0.0" # Used if building outside a Git repo (e.g., from an sdist)
format = "{base}.{revision}{distance}"

[project.optional-dependencies]
dev = ["Sphinx", "sphinx-rtd-theme", "sphinxcontrib-napoleon"]
all = ["mxdc[dev]"]

